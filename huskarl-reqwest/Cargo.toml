[package]
name = "huskarl-reqwest"
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
description = "reqwest support for the huskarl OAuth2 ecosystem."
repository = "https://github.com/huskarl-rs/huskarl"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "security", "authentication"]
categories = ["authentication"]
readme = "README.md"

[features]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
huskarl-macros = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
huskarl-core = { workspace = true }
reqwest = { workspace = true }
snafu = { workspace = true }

[dev-dependencies]
# Turns a dropped classification into a panic during this workspace's tests;
# off for dependents, whose own causes may legitimately wrap one. See
# `huskarl_core::Error::propagate`.
huskarl-core = { workspace = true, features = ["strict-propagation"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
