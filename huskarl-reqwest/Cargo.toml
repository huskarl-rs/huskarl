[package]
name = "huskarl-reqwest"
version = "0.9.3"
edition = "2024"
rust-version = "1.92"
description = "reqwest support for the huskarl OAuth2 ecosystem."
repository = "https://github.com/huskarl-rs/huskarl"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "security", "authentication"]
categories = ["authentication"]
readme = "README.md"

[features]
# Structured diagnostics; the application configures the subscriber.
tracing = ["dep:tracing", "huskarl-core/tracing"]

rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
tracing = { workspace = true, optional = true }
huskarl-macros = { version = "0.4", path = "../huskarl-macros" }
bon = { version = "3.9", default-features = false }
bytes = { version = "1.7.1", default-features = false }
http = { version = "1.1", default-features = false }
huskarl-core = { version = "0.10.8", path = "../huskarl-core" }
reqwest = { version = "0.13", default-features = false }
snafu = { workspace = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["std", "fmt", "registry"] }
# Turns a dropped classification into a panic during this workspace's tests;
# off for dependents, whose own causes may legitimately wrap one. See
# `huskarl_core::Error::propagate`.
huskarl-core = { path = "../huskarl-core", features = ["strict-propagation"] }
# Only for the `EnumCount` exhaustiveness checks.
strum = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.51", features = ["macros", "rt-multi-thread"] }
