[tools]
"aqua:EmbarkStudios/cargo-deny" = "0.19.9"
"aqua:wasm-bindgen/wasm-pack" = "0.15.0"
"cargo:cargo-docs-rs" = "1.0.4"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-msrv" = "0.19.3"
"cargo:cargo-nextest" = "0.9.138"
"cargo:cargo-reedme" = "0.6.1"
"cargo:cargo-semver-checks" = "0.48.0"
"cargo:cargo-vet" = "0.10.2"
wasmtime = "43"
zizmor = "1.25.2"

[tasks."wasm:test:chrome"]
run = "wasm-pack test --headless --chrome -- --lib"

[tasks."wasm:test:firefox"]
run = "wasm-pack test --headless --firefox -- --lib"

[tasks."wasm:test:node"]
run = "wasm-pack test --node -- --lib"

[tasks."webcrypto:test"]
description = "WebCrypto crate wasm tests under Node, including the pure-Rust AES-GCM interop suite"
dir = "huskarl-crypto-webcrypto"
# The native-seal interop direction draws its nonce from getrandom; select its
# wasm backend (Workers/Node expose `crypto.getRandomValues`).
env = { RUSTFLAGS = '--cfg getrandom_backend="wasm_js"' }
run = "wasm-pack test --node -- --lib"

[tasks."fuzz:run"]
description = "Fuzz a huskarl-core target from its seed corpus"
dir = "huskarl-core"
usage = '''
arg "<target>" help="Fuzz target" {
  choices "parse_compact_jws" "unseal_v1" "jwks" "challenges"
}
flag "--time <seconds>" help="Stop after this many seconds (default: run until interrupted)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
host=$(rustc -vV | sed -n 's/host: //p')
mkdir -p "fuzz/corpus/${usage_target?}"
cargo fuzz run "${usage_target?}" "fuzz/corpus/${usage_target?}" "fuzz/seeds/${usage_target?}" \
  --target "$host" -- -max_len=16384 ${usage_time:+-max_total_time=$usage_time}
'''

[tasks."fuzz:coverage"]
description = "Report what a fuzz target's accumulated corpus actually covers"
dir = "huskarl-core"
usage = '''
arg "<target>" help="Fuzz target" {
  choices "parse_compact_jws" "unseal_v1" "jwks" "challenges"
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
host=$(rustc -vV | sed -n 's/host: //p')
mkdir -p "fuzz/corpus/${usage_target?}"
cargo fuzz coverage "${usage_target?}" "fuzz/corpus/${usage_target?}" "fuzz/seeds/${usage_target?}" --target "$host"
# The outer triple in the binary path is cargo-fuzz's own build host (x86_64
# under Rosetta), not necessarily $host — glob it.
bin=$(ls -t target/*/coverage/"$host"/release/"${usage_target?}" | head -1)
llvm_cov=$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-cov
profdata=fuzz/coverage/${usage_target?}/coverage.profdata
"$llvm_cov" report "$bin" -instr-profile="$profdata" -ignore-filename-regex='\.rustup|\.cargo|fuzz_targets'
"$llvm_cov" show "$bin" --format=html -instr-profile="$profdata" \
  -ignore-filename-regex='\.rustup|\.cargo|fuzz_targets' > "fuzz/coverage/${usage_target?}/index.html"
echo
echo "HTML report: huskarl-core/fuzz/coverage/${usage_target?}/index.html"
'''

[tasks."docs:rs"]
run = "cargo +nightly docs-rs"

[tasks."docs:readme"]
# The workspace run only covers default-members; huskarl-crypto-webcrypto is
# excluded there (wasm32-only), so regenerate its README explicitly.
run = [
  "cargo +nightly reedme",
  "cargo +nightly reedme --manifest-path huskarl-crypto-webcrypto/Cargo.toml",
]
