[target.wasm32-wasip2]
runner = "wasmtime"

# Single source of truth for which crates build on which target:
# - huskarl-crypto-webcrypto is wasm32-only (its futures are !Send)
# - the integration harness crates (tokio net, uuid) are host-only
[alias]
check-wasm = "check --target wasm32-unknown-unknown --workspace --exclude huskarl-conformance --exclude huskarl-testkit"
clippy-wasm = "clippy -p huskarl-crypto-webcrypto --target wasm32-unknown-unknown --all-features --all-targets"
clippy-host = "clippy --workspace --exclude huskarl-crypto-webcrypto --all-features --all-targets"
