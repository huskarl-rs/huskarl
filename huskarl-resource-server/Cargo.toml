[package]
name = "huskarl-resource-server"
version = "0.11.0"
edition = "2024"
rust-version = "1.92"
description = "Resource server (JWT validation) support for the huskarl OAuth2 ecosystem."
repository = "https://github.com/huskarl-rs/huskarl"
homepage = "https://github.com/huskarl-rs/huskarl"
documentation = "https://docs.rs/huskarl-resource-server"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "jwt", "security", "authentication"]
categories = ["authentication"]
readme = "README.md"

[package.metadata.docs.rs]
# Render the `_docs` module (gated on `cfg(docsrs)`) and enable `doc_cfg`.
# `cargo docs-rs` reads this block too.
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
default = ["default-jws-verifier-platform"]

# When enabled, adds support for the platform default crypto implementation.
default-jws-verifier-platform = ["dep:huskarl-crypto-native", "dep:huskarl-crypto-webcrypto"]

[dependencies]
huskarl-core = { workspace = true }

bon = { workspace = true }
bytes = { workspace = true }
http = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
strum = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }


### Dependencies available on all platforms except WASM-not-WASI
[target.'cfg(not(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none"))))'.dependencies]
tokio = { workspace = true, features = ["time"] }
huskarl-crypto-native = { workspace = true, optional = true }

### Dependencies available on WASM-not-WASI
[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies]
huskarl-crypto-webcrypto = { workspace = true, optional = true }
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
gloo-timers = { version = "0.4", default-features = false, features = ["futures"] }
web-time = { version = "1.1", default-features = false }

[dev-dependencies]
# Turns a dropped classification into a panic during this workspace's tests;
# off for dependents, whose own causes may legitimately wrap one. See
# `huskarl_core::Error::propagate`.
huskarl-core = { workspace = true, features = ["strict-propagation"] }
metrics = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
huskarl-crypto-native = { path = "../huskarl-crypto-native" }
huskarl-reqwest = { path = "../huskarl-reqwest" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
httpmock = "0.8.3"
rstest = { workspace = true }

# The example uses dev-dependencies, so rustdoc skips scraping it unless we
# opt in explicitly. docs.rs scrapes examples, so this surfaces `basic` as a
# usage example on the items it exercises (and silences the scrape warning).
[[example]]
name = "basic"
doc-scrape-examples = true
