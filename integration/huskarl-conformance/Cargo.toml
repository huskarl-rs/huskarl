[package]
name = "huskarl-conformance"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Enables integration tests that require a running OpenID conformance suite instance.
# See README for setup instructions.
conformance-suite-tests = []

[dependencies]
bytes = "1.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
http = "1.1"
huskarl = { path = "../../huskarl", features = ["url", "authorization-flow-loopback"] }
huskarl-reqwest = { path = "../../huskarl-reqwest", features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "query", "form"] }
scraper = { version = "0.27", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.51", default-features = false, features = ["rt", "sync", "macros", "time", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
bon = { workspace = true }
huskarl-crypto-native = { path = "../../huskarl-crypto-native" }
huskarl-testkit = { path = "../huskarl-testkit" }
tokio = { version = "1.51", features = ["macros", "rt-multi-thread"] }
