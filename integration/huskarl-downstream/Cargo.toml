[package]
name = "huskarl-downstream"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Scratch downstream consumer — verifies ergonomics from outside the library"

[dependencies]
huskarl = { workspace = true }

bytes = { workspace = true }
http = { workspace = true, features = ["std"] }
thiserror = "2.0.12"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
