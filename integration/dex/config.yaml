# Dex config for huskarl integration tests.
issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  responseTypes: ["code"]
  skipApprovalScreen: true

staticClients:
  - id: huskarl-authcode
    name: huskarl auth-code test client
    secret: huskarl-authcode-secret
    redirectURIs:
      - http://127.0.0.1:5557/callback

# Fixed-identity connector — no login form.
connectors:
  - type: mockCallback
    id: mock
    name: Mock
