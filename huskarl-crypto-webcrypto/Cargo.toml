[package]
name = "huskarl-crypto-webcrypto"
version = "0.10.0"
edition = "2024"
rust-version = "1.92"
description = "WebCrypto support for huskarl (OAuth2 client) ecosystem."
repository = "https://github.com/huskarl-rs/huskarl"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "security", "authentication", "wasm"]
categories = ["authentication"]
readme = "README.md"

[package.metadata.docs.rs]
# The crate is empty off-wasm32 (see lib.rs), so docs.rs must build the wasm
# target to render anything.
default-target = "wasm32-unknown-unknown"

[dependencies]
huskarl-core = { workspace = true }

serde-wasm-bindgen = { version = "0.6", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
wasm-bindgen = { version = "0.2", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }
serde = { version = "1.0", default-features = false }
serde_bytes = { version = "0.11", default-features = false }
snafu = { version = "0.9", default-features = false }
web-sys = { version = "0.3", features = [
  "Crypto",
  "CryptoKey",
  "CryptoKeyPair",
  "JsonWebKey",
  "SubtleCrypto",
] }

[dev-dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
wasm-bindgen-test = "0.3"
# Interop tests: confirm the WebCrypto cipher and the pure-Rust `aes-gcm` cipher
# agree on the AES-256-GCM wire format. Native sealing on wasm needs getrandom's
# wasm_js backend — run via `RUSTFLAGS='--cfg getrandom_backend="wasm_js"'`.
huskarl-crypto-native = { path = "../huskarl-crypto-native", default-features = false }
