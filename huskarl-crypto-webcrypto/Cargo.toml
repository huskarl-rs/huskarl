[package]
name = "huskarl-crypto-webcrypto"
version = "0.11.0"
edition = "2024"
rust-version = "1.92"
description = "WebCrypto support for the huskarl OAuth2 ecosystem."
repository = "https://github.com/huskarl-rs/huskarl"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "security", "authentication", "wasm"]
categories = ["authentication"]
readme = "README.md"

[package.metadata.docs.rs]
# The crate is empty off-wasm32 (see lib.rs), so docs.rs must build the wasm
# target to render anything.
default-target = "wasm32-unknown-unknown"

[dependencies]
huskarl-macros = { workspace = true }
huskarl-core = { workspace = true }

serde-wasm-bindgen = { version = "0.6", default-features = false }
serde_json = { workspace = true }
wasm-bindgen = { version = "0.2.114", default-features = false }
wasm-bindgen-futures = { version = "0.4.18", default-features = false }
serde = { workspace = true }
serde_bytes = { version = "0.11", default-features = false }
snafu = { workspace = true }
web-sys = { version = "0.3.91", features = [
  "Crypto",
  "CryptoKey",
  "CryptoKeyPair",
  "JsonWebKey",
  "SubtleCrypto",
] }

[dev-dependencies]
# Turns a dropped classification into a panic during this workspace's tests;
# off for dependents, whose own causes may legitimately wrap one. See
# `huskarl_core::Error::propagate`.
huskarl-core = { workspace = true, features = ["strict-propagation"] }
base64 = { workspace = true }
wasm-bindgen-test = "0.3"
# Interop tests: confirm the WebCrypto cipher and the pure-Rust `aes-gcm` cipher
# agree on the AES-256-GCM wire format. Native sealing on wasm needs getrandom's
# wasm_js backend — run via `RUSTFLAGS='--cfg getrandom_backend="wasm_js"'`.
huskarl-crypto-native = { path = "../huskarl-crypto-native", default-features = false }
