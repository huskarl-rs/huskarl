name: Semver

on:
  pull_request:

permissions:
  contents: read

jobs:
  semver:
    name: Semver report
    runs-on: ubuntu-latest
    # Skip the release-plz PR: it only bumps versions/changelogs (no API change),
    # its commit is `chore: release`, and release-plz already runs its own
    # cargo-semver-checks to compute those bumps.
    if: >-
      ${{ github.repository_owner == 'huskarl-rs'
          && !startsWith(github.head_ref, 'release-plz-') }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so cargo-semver-checks can resolve the base commit.
          fetch-depth: 0
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: "cargo:cargo-semver-checks"
      - name: Generate semver report
        env:
          SEMVER_REPORT: ${{ runner.temp }}/semver.md
        run: scripts/semver-report.sh "${{ github.event.pull_request.base.sha }}"
      - name: Post semver report
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: semver-report
          path: ${{ runner.temp }}/semver.md
