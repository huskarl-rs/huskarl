name: Published bounds

# Checks each crate alone at its minimum dependency versions, using crates.io for
# other huskarl crates. Only reports on PRs, as new versions aren't published yet.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  published-bounds:
    name: Published bounds
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.result.outputs.report }}
    env:
      BOUNDS_RESULTS: ${{ runner.temp }}/bounds-results.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --no-self-update --profile minimal
      - run: rustup update stable --no-self-update && rustup target add wasm32-unknown-unknown
      - uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: "cargo:cargo-hack cargo:cargo-minimal-versions"
      - name: Check native
        id: native
        env:
          BOUNDS_CHECK: native (all features)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: >-
          scripts/check-minimal-versions.sh
          huskarl-macros,huskarl-core,huskarl-crypto-native,huskarl-google-cloud,huskarl-redis,huskarl-reqwest,huskarl-resource-server,huskarl
          --all-features
      - name: Check wasm
        id: wasm
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        env:
          BOUNDS_CHECK: wasm (default features)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: >-
          scripts/check-minimal-versions.sh
          huskarl-macros,huskarl-core,huskarl-crypto-native,huskarl-crypto-webcrypto,huskarl-reqwest,huskarl-resource-server,huskarl
          --target wasm32-unknown-unknown
      - name: Check wasm tracing
        id: wasm-tracing
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        env:
          BOUNDS_CHECK: wasm (tracing)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: >-
          scripts/check-minimal-versions.sh
          huskarl-core,huskarl-crypto-native,huskarl-crypto-webcrypto,huskarl-reqwest,huskarl-resource-server,huskarl
          --target wasm32-unknown-unknown --features tracing
      - name: Summarize results
        id: result
        if: ${{ !cancelled() }}
        env:
          NATIVE: ${{ steps.native.outcome }}
          WASM: ${{ steps.wasm.outcome }}
          WASM_TRACING: ${{ steps.wasm-tracing.outcome }}
        run: |
          {
            if [ "$NATIVE" = success ] && [ "$WASM" = success ] && [ "$WASM_TRACING" = success ]; then
              echo ':white_check_mark: All checked configurations compile at their minimum dependency versions.'
            else
              echo ':warning: Some checks failed or did not complete. See the per-crate results and run log.'
            fi
            printf '\nCheck steps: native=%s, wasm=%s, wasm-tracing=%s.\n\n' "$NATIVE" "$WASM" "$WASM_TRACING"
            echo '| Configuration | Crate | Result |'
            echo '| --- | --- | --- |'
            if [ -f "$BOUNDS_RESULTS" ]; then
              cat "$BOUNDS_RESULTS"
            fi
            echo
            echo '`resolve`: dependency resolution failed (possibly an unpublished version).'
            echo '`compile`: compilation failed; a version requirement may be too low.'
            echo '`other`: tooling, network, or another unclassified failure; inspect the run log.'
          } > "$RUNNER_TEMP/bounds-report.md"
          cat "$RUNNER_TEMP/bounds-report.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'report<<BOUNDS_REPORT_END'
            cat "$RUNNER_TEMP/bounds-report.md"
            echo 'BOUNDS_REPORT_END'
          } >> "$GITHUB_OUTPUT"

  comment:
    name: Report on PR
    needs: published-bounds
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      pull-requests: write
    steps:
      - name: Write report
        env:
          REPORT: ${{ needs.published-bounds.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '### Published bounds\n\n%s\n\n[Run log](%s)\n' "$REPORT" "$RUN_URL" > "$RUNNER_TEMP/bounds.md"
      - name: Post report
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: published-bounds
          path: ${{ runner.temp }}/bounds.md
