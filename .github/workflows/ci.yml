name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # huskarl-crypto-webcrypto is wasm32-only; the WASM job covers it.
      - run: cargo test --workspace --exclude huskarl-crypto-webcrypto

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy-host -- -D warnings
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy-wasm -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup component add rustfmt
      - run: cargo fmt --all --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Include private items so rustdoc validates links on `pub(crate)` APIs.
      - run: cargo doc --workspace --exclude huskarl-crypto-webcrypto --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p huskarl-crypto-webcrypto --target wasm32-unknown-unknown --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  doc-tests:
    name: Doc tests (docsrs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # huskarl-resource-server's `_docs` explanation/guide module is gated on
      # `cfg(docsrs)` (see its lib.rs), so those how-to doctests only run when
      # rustdoc parses with `--cfg docsrs`. That cfg activates `feature(doc_cfg)`,
      # which requires nightly — this mirrors the docs.rs build environment. The
      # stable `test` job above still runs the inline (non-`_docs`) doctests.
      - run: rustup toolchain install nightly --no-self-update --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # huskarl-crypto-webcrypto is wasm32-only; excluded like the test job.
      - run: cargo +nightly test --workspace --exclude huskarl-crypto-webcrypto --doc --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.92 --no-self-update --profile minimal && rustup default 1.92
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --exclude huskarl-crypto-webcrypto

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup target add wasm32-unknown-unknown
      - run: rustup toolchain install nightly --no-self-update --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: "cargo:cargo-hack cargo:cargo-minimal-versions"
      - run: mise run --skip-tools minimal-versions --direct

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check-wasm

  integration:
    name: Integration (local providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: "cargo:cargo-nextest"
      - name: Start providers
        working-directory: integration
        run: |
          docker compose up --wait                                                # Keycloak (8080 + 8444)
          docker compose -f dex/docker-compose.yml up -d                          # Dex (5556)
          docker compose -f node-oidc-provider/docker-compose.yml up -d --build   # node-oidc (3000)
          docker compose -f redis/docker-compose.yml up --wait                    # Redis (6379)
          # Dex and node-oidc images carry no healthcheck, so wait on their
          # discovery endpoints from the host (mirrors the mise `*:up` tasks).
          for url in \
            http://127.0.0.1:5556/dex/.well-known/openid-configuration \
            http://127.0.0.1:3000/.well-known/openid-configuration; do
            for i in $(seq 1 60); do
              if curl -sf "$url" >/dev/null 2>&1; then break; fi
              if [ "$i" -eq 60 ]; then echo "timed out waiting for $url" >&2; exit 1; fi
              sleep 1
            done
          done
      # Okta is intentionally excluded (hosted; needs a tenant). Without its
      # feature, the okta binary's trials are ignored.
      - name: Run tests
        run: cargo nextest run -p huskarl-integration --features keycloak,dex,node-oidc
      # huskarl-redis's server-backed tests are `#[ignore]`d without the
      # opt-in, so they need their own invocation (mirrors `redis:test`).
      - name: Run huskarl-redis tests
        run: cargo nextest run -p huskarl-redis --test redis --run-ignored ignored-only
      - name: Stop providers
        working-directory: integration
        if: always()
        run: |
          docker compose down
          docker compose -f dex/docker-compose.yml down
          docker compose -f node-oidc-provider/docker-compose.yml down
          docker compose -f redis/docker-compose.yml down
