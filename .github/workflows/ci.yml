name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # huskarl-crypto-webcrypto is wasm32-only; the WASM job covers it.
      - run: cargo test --workspace --exclude huskarl-crypto-webcrypto

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup component add clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy-host -- -D warnings
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy-wasm -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup component add rustfmt
      - run: cargo fmt --all --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.92 --no-self-update --profile minimal && rustup default 1.92
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace --exclude huskarl-crypto-webcrypto

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --no-self-update --profile minimal
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo +nightly update -Z minimal-versions
      - run: cargo build --workspace --exclude huskarl-crypto-webcrypto --no-default-features

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check-wasm

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          # huskarl-crypto-webcrypto is wasm32-only and cannot be rustdoc'd on
          # the host target; cargo-semver-checks' wasm32 --target probe also
          # fails (cargo --print=file-names quirk), so skip it entirely.
          exclude: huskarl-crypto-webcrypto

  integration:
    name: Integration (local providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Runs each test in its own process (isolation + per-test timeouts) — see
      # .config/nextest.toml. Install cargo-binstall first so mise's `cargo:`
      # backend fetches the prebuilt binary instead of compiling; mise then
      # installs the same `cargo:cargo-nextest` declared in mise.toml (scoped via
      # install_args so the rest of the dev toolchain isn't pulled in), keeping
      # local and CI on one source of truth. Both actions are SHA-pinned.
      - uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: "cargo:cargo-nextest"
      - name: Start providers
        working-directory: integration
        run: |
          docker compose up --wait                                                # Keycloak (8080 + 8444)
          docker compose -f dex/docker-compose.yml up -d                          # Dex (5556)
          docker compose -f node-oidc-provider/docker-compose.yml up -d --build   # node-oidc (3000)
          # Dex and node-oidc images carry no healthcheck, so wait on their
          # discovery endpoints from the host (mirrors the mise `*:up` tasks).
          for url in \
            http://127.0.0.1:5556/dex/.well-known/openid-configuration \
            http://127.0.0.1:3000/.well-known/openid-configuration; do
            for i in $(seq 1 60); do
              if curl -sf "$url" >/dev/null 2>&1; then break; fi
              if [ "$i" -eq 60 ]; then echo "timed out waiting for $url" >&2; exit 1; fi
              sleep 1
            done
          done
      # Okta is intentionally excluded (hosted; needs a tenant). Without its
      # feature, the okta binary's trials are ignored.
      - name: Run tests
        run: cargo nextest run -p huskarl-integration --features keycloak,dex,node-oidc
      - name: Stop providers
        working-directory: integration
        if: always()
        run: |
          docker compose down
          docker compose -f dex/docker-compose.yml down
          docker compose -f node-oidc-provider/docker-compose.yml down
