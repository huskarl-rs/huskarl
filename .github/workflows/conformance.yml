name: Conformance

# The OpenID conformance suite is slow, so it does not gate PRs (those run the
# local provider matrix in ci.yml). It runs weekly, and on demand via the
# "Run workflow" button. Scheduled runs only fire on the default branch.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: OpenID Conformance (OIDC + FAPI2)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Start conformance suite
        working-directory: integration
        run: docker compose -f huskarl-conformance/docker/docker-compose-prebuilt.yml up --wait
      - name: Run conformance tests
        run: cargo test -p huskarl-conformance --features conformance-suite-tests -- --nocapture
      - name: Stop conformance suite
        working-directory: integration
        if: always()
        run: docker compose -f huskarl-conformance/docker/docker-compose-prebuilt.yml down
