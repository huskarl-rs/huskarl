name: Conformance

# The OpenID conformance suite is slow, so it does not gate PRs (those run the
# local provider matrix in ci.yml). It runs weekly, and on demand via the
# "Run workflow" button. Scheduled runs only fire on the default branch.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONFORMANCE_INSECURE_TLS: "true"
  CONFORMANCE_EVIDENCE_DIR: ${{ github.workspace }}/target/conformance

jobs:
  conformance:
    name: OpenID Conformance (OIDC + FAPI2)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Start conformance suite
        working-directory: integration
        run: docker compose -f huskarl-conformance/docker/docker-compose-prebuilt.yml up --pull always --wait
      - name: Run conformance tests
        run: cargo test -p huskarl-conformance --features conformance-suite-tests -- --nocapture
      - name: Capture container evidence
        if: always()
        run: |
          mkdir -p target/conformance
          docker compose -f integration/huskarl-conformance/docker/docker-compose-prebuilt.yml images --format json > target/conformance/images.json
          docker compose -f integration/huskarl-conformance/docker/docker-compose-prebuilt.yml logs --no-color > target/conformance/containers.log
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-evidence
          path: target/conformance/
          retention-days: 14
      - name: Stop conformance suite
        working-directory: integration
        if: always()
        run: docker compose -f huskarl-conformance/docker/docker-compose-prebuilt.yml down
