[package]
name = "huskarl-crypto-native"
version = "0.8.1"
edition = "2024"
rust-version = "1.92"
description = "Native crypto for huskarl (OAuth2 client) ecosystem."
repository = "https://github.com/huskarl-rs/huskarl"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "security", "authentication"]
categories = ["authentication"]
readme = "README.md"

[dependencies]
huskarl-core = { workspace = true }

ed25519-dalek = { version = "=3.0.0-rc.1", default-features = false, features = ["pem", "zeroize"] }
hmac = { version = "0.13", default-features = true }
pkcs8 = { version = "0.11", default-features = false }
p256 = { version = "=0.14.0-rc.12", default-features = false, features = ["ecdsa", "pem", "std"] }
p384 = { version = "=0.14.0-rc.12", default-features = false, features = ["ecdsa", "pem"] }
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng", "thread_rng"] }
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["encoding", "sha2"] }
sha2 = { version = "0.11", default-features = false }
signature = { version = "3.0", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
snafu = { version = "0.9", default-features = false, features = ["rust_1_81", "std"] }
strum = { workspace = true }
subtle = { version = "2.6.1", default-features = false }
aes-gcm = { version = "=0.11.0-rc.4", default-features = false, features = ["aes", "alloc", "rand_core", "zeroize"] }

[dev-dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
