[workspace]
resolver = "3"
members = [
  "huskarl",
  "huskarl-core",
  "huskarl-crypto-native",
  "huskarl-crypto-webcrypto",
  "huskarl-google-cloud",
  "huskarl-macros",
  "huskarl-redis",
  "huskarl-reqwest",
  "huskarl-resource-server",
  "integration/huskarl-conformance",
  "integration/huskarl-downstream",
  "integration/huskarl-integration",
  "integration/huskarl-testkit",
]
# huskarl-crypto-webcrypto only compiles for wasm32-unknown-unknown (its
# futures are !Send), so host-target builds skip it by default. Check it with
# `cargo check -p huskarl-crypto-webcrypto --target wasm32-unknown-unknown`.
default-members = [
  "huskarl",
  "huskarl-core",
  "huskarl-crypto-native",
  "huskarl-google-cloud",
  "huskarl-macros",
  "huskarl-redis",
  "huskarl-reqwest",
  "huskarl-resource-server",
  "integration/huskarl-conformance",
  "integration/huskarl-downstream",
  "integration/huskarl-integration",
  "integration/huskarl-testkit",
]
exclude = ["huskarl-core/fuzz"]

[workspace.dependencies]
huskarl = { version = "0.11", path = "./huskarl" }
huskarl-core = { version = "0.10", path = "./huskarl-core" }
huskarl-macros = { version = "0.4", path = "./huskarl-macros" }
huskarl-redis = { version = "0.3", path = "./huskarl-redis" }
huskarl-reqwest = { version = "0.9", path = "./huskarl-reqwest" }
huskarl-crypto-native = { version = "0.11", path = "./huskarl-crypto-native" }
huskarl-crypto-webcrypto = { version = "0.11", path = "./huskarl-crypto-webcrypto" }
huskarl-google-cloud = { version = "0.8", path = "./huskarl-google-cloud" }
huskarl-resource-server = { version = "0.11", path = "./huskarl-resource-server" }

base64 = { version = "0.23", default-features = false, features = ["std"] }
bon = { version = "3.10", default-features = false, features = [
  "alloc",
  "experimental-generics-setters",
] }
bytes = { version = "1.10", default-features = false }
form_urlencoded = { version = "1.2.1", default-features = false, features = [
  "std",
] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
http = { version = "1.1", default-features = false }
httpdate = { version = "1", default-features = false }
rand = { version = "0.10", default-features = false, features = [
  "std",
  "sys_rng",
  "thread_rng",
] }
reqwest = { version = "0.13", default-features = false }
rstest = { version = "0.26", default-features = false }
serde = { version = "1.0.228", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.148", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
snafu = { version = "0.9", default-features = false, features = [
  "rust_1_81",
  "std",
] }
strum = { version = "0.27", default-features = false, features = ["derive"] }
subtle = { version = "2.6", default-features = false }
tokio = { version = "1.45.1", default-features = false }
metrics = { version = "0.24.2", default-features = false }
url = { version = "2.5", default-features = false }
