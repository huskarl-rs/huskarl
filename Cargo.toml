[workspace]
resolver = "3"
members = [
  "huskarl",
  "huskarl-core",
  "huskarl-crypto-native",
  "huskarl-crypto-webcrypto",
  "huskarl-google-cloud",
  "huskarl-macros",
  "huskarl-redis",
  "huskarl-reqwest",
  "huskarl-resource-server",
  "integration/huskarl-conformance",
  "integration/huskarl-downstream",
  "integration/huskarl-integration",
  "integration/huskarl-testkit",
]
# huskarl-crypto-webcrypto only compiles for wasm32-unknown-unknown (its
# futures are !Send), so host-target builds skip it by default. Check it with
# `cargo check -p huskarl-crypto-webcrypto --target wasm32-unknown-unknown`.
default-members = [
  "huskarl",
  "huskarl-core",
  "huskarl-crypto-native",
  "huskarl-google-cloud",
  "huskarl-macros",
  "huskarl-redis",
  "huskarl-reqwest",
  "huskarl-resource-server",
]
exclude = ["huskarl-core/fuzz"]

[workspace.dependencies]
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }

base64 = { version = "0.23", default-features = false, features = ["std"] }
bon = { version = "3.9", default-features = false, features = [
  "alloc",
  "experimental-generics-setters",
  "implied-bounds",
] }
form_urlencoded = { version = "1.2", default-features = false, features = ["std"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
httpdate = { version = "1.0.3", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng", "thread_rng"] }
serde = { version = "1.0.203", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.50", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
snafu = { version = "0.9", default-features = false, features = ["rust_1_81", "std"] }
strum = { version = "0.27", default-features = false, features = ["derive"] }
metrics = { version = "0.24.2", default-features = false }
tracing = { version = "0.1.21", default-features = false, features = ["std", "attributes"] }
url = { version = "2", default-features = false }
