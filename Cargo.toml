[workspace]
resolver = "3"
members = [
  "huskarl",
  "huskarl-core",
  "huskarl-crypto-native",
  "huskarl-crypto-webcrypto",
  "huskarl-macros",
  "huskarl-reqwest",
  "huskarl-resource-server",
  "integration/huskarl-conformance",
  "integration/huskarl-downstream",
  "integration/huskarl-integration",
  "integration/huskarl-testkit",
]
# huskarl-crypto-webcrypto only compiles for wasm32-unknown-unknown (its
# futures are !Send), so host-target builds skip it by default. Check it with
# `cargo check -p huskarl-crypto-webcrypto --target wasm32-unknown-unknown`.
default-members = [
  "huskarl",
  "huskarl-core",
  "huskarl-crypto-native",
  "huskarl-macros",
  "huskarl-reqwest",
  "huskarl-resource-server",
  "integration/huskarl-conformance",
  "integration/huskarl-downstream",
  "integration/huskarl-integration",
  "integration/huskarl-testkit",
]
exclude = ["huskarl-core/fuzz"]

[workspace.dependencies]
huskarl = { version = "0.9.0-pre.0", path = "./huskarl" }
huskarl-core = { version = "0.7", path = "./huskarl-core" }
huskarl-macros = { version = "0.3", path = "./huskarl-macros" }
huskarl-reqwest = { version = "0.7", path = "./huskarl-reqwest" }
huskarl-crypto-native = { version = "0.8", path = "./huskarl-crypto-native" }
huskarl-crypto-webcrypto = { version = "0.8", path = "./huskarl-crypto-webcrypto" }

bon = { version = "3.9", default-features = false, features = [
  "alloc",
  "experimental-generics-setters",
  "implied-bounds",
] }
form_urlencoded = { version = "1", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng", "thread_rng"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
snafu = { version = "0.9", default-features = false, features = ["rust_1_81", "std"] }
strum = { version = "0.27", default-features = false, features = ["derive"] }
metrics = { version = "0.24", default-features = false }
url = { version = "2", default-features = false }
