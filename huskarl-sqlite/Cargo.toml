[package]
name = "huskarl-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "SQLite-backed replay prevention for the huskarl OAuth2 ecosystem."
repository = "https://github.com/huskarl-rs/huskarl"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "security", "authentication", "sqlite"]
categories = ["authentication"]
readme = "README.md"

[features]
default = ["bundled"]
bundled = ["sqlx/sqlite"]
unbundled = ["sqlx/sqlite-unbundled"]

[dependencies]
bon.workspace = true
hex.workspace = true
huskarl-core.workspace = true
sha2 = { workspace = true, default-features = false }
snafu.workspace = true
sqlx = { version = "0.8.6", default-features = false }
thiserror = "2.0.20"

[dev-dependencies]
rstest = { version = "0.26", default-features = false }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
