[package]
name = "huskarl-sqlite"
version = "0.1.0"
edition = "2024"

[features]
default = ["bundled"]
bundled = ["sqlx/sqlite-bundled"]
unbundled = ["sqlx/sqlite-unbundled"]

[dependencies]
bon.workspace = true
hex.workspace = true
huskarl-core.workspace = true
sha2 = { workspace = true, default-features = false }
snafu.workspace = true
sqlx = { version = "0.9.0", default-features = false }
thiserror = "2.0.20"

[dev-dependencies]
rstest = { version = "0.26", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
