[package]
name = "huskarl-redis"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "Redis-backed replay prevention for the huskarl OAuth2 ecosystem."
repository = "https://github.com/huskarl-rs/huskarl"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "security", "authentication", "redis"]
categories = ["authentication"]
readme = "README.md"

[features]
# redis's `aio` won't build without a runtime comp; opt out if your app's
# redis dep already enables one.
default = ["tokio-comp"]
tokio-comp = ["redis/tokio-comp"]

[dependencies]
bon.workspace = true
hex.workspace = true
huskarl-core.workspace = true
redis = { version = "1", default-features = false, features = ["aio"] }
sha2 = { workspace = true, default-features = false }
snafu = { workspace = true }

[dev-dependencies]
# Turns a dropped classification into a panic during this workspace's tests;
# off for dependents, whose own causes may legitimately wrap one. See
# `huskarl_core::Error::propagate`.
huskarl-core = { workspace = true, features = ["strict-propagation"] }
redis-test = { version = "1", features = ["aio"] }
rstest = { version = "0.26", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
