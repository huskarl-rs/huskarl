[package]
name = "huskarl-core"
version = "0.9.1"
edition = "2024"
rust-version = "1.92"
description = "Base library for huskarl (OAuth2 client) ecosystem."
repository = "https://github.com/huskarl-rs/huskarl"
homepage = "https://github.com/huskarl-rs/huskarl"
documentation = "https://docs.rs/huskarl-core"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "security", "authentication"]
categories = ["authentication"]
readme = "README.md"

[package.metadata.docs.rs]
# Render the `_docs` module (gated on `cfg(docsrs)`) and enable `doc_cfg`.
# `cargo docs-rs` reads this block too.
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
default = ["url"]

# When enabled, an EndpointUrl can be constructed from a url::Url.
url = ["dep:url"]

# When enabled, emits metrics via the `metrics` crate facade.
metrics = ["dep:metrics"]

# When enabled, provides FileSecret for reading secrets from files using async I/O.
fs = ["tokio/fs"]

# When enabled, `Error::new` panics when handed a cause that already wraps a
# classified error.
strict-propagation = []

[dependencies]
arc-swap = "1"
metrics = { workspace = true, optional = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
bon = { workspace = true }
bytes = { version = "1", default-features = false }
form_urlencoded = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = { workspace = true }
http = { version = "1", default-features = false, features = ["std"] }
rand = { workspace = true }
secrecy = { version = "0.10.3", default-features = false }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
sha2 = { workspace = true, default-features = false }
snafu = { workspace = true }
strum = { workspace = true }
subtle = { version = "2.6.1", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"] }
url = { workspace = true, optional = true }
zeroize = { version = "1", default-features = false }

### Dependencies available on native and WASI (not browser WASM)
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { version = "1", default-features = false, features = ["time"] }

### Dependencies available on browser WASM (wasm32-unknown-unknown)
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
gloo-timers = { version = "0.4", default-features = false, features = ["futures"] }
web-time = { version = "1", default-features = false, features = ["serde"] }

[dev-dependencies]
rstest = { version = "0.26.1", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

### Integration tests require multi-threaded runtime and network access.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
httpmock = "0.8.3"
tempfile = "3"
