[package]
name = "huskarl"
version = "0.10.1"
edition = "2024"
rust-version = "1.92"
description = '''
A modern OAuth2 client library.
'''
repository = "https://github.com/huskarl-rs/huskarl"
homepage = "https://github.com/huskarl-rs/huskarl"
documentation = "https://docs.rs/huskarl"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "security", "authentication"]
categories = ["authentication"]
readme = "README.md"

[package.metadata.docs.rs]
# Render the `_docs` module (gated on `cfg(docsrs)`) and enable `doc_cfg`.
# `cargo docs-rs` reads this block too.
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
default = ["default-jws-verifier-platform"]

# When enabled, adds support for the platform default crypto implementation.
default-jws-verifier-platform = ["dep:huskarl-crypto-native", "dep:huskarl-crypto-webcrypto"]

# When enabled, adds support for a loopback HTTP server that can handle
# the callback for the authorization code flow.
authorization-flow-loopback = ["dep:url", "tokio/net", "tokio/io-util", "tokio/time"]

# When enabled, an EndpointUrl can be constructed from a url::Url.
url = ["huskarl-core/url"]

[dependencies]
huskarl-core = { workspace = true }
huskarl-macros = { workspace = true }

arc-swap = "1"
base64 = { version = "0.22", default-features = false, features = ["std"] }
bon = { workspace = true }
bytes = { version = "1", default-features = false }
form_urlencoded = { workspace = true }
http = { version = "1", default-features = false, features = ["std"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
subtle = { version = "2", default-features = false }
tokio = { version = "1.51", default-features = false, features = ["sync"] }
url = { workspace = true, optional = true }

### Dependencies available on all platforms except WASM-not-WASI
[target.'cfg(not(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none"))))'.dependencies]
huskarl-crypto-native = { workspace = true, optional = true }

### Dependencies available on WASM-not-WASI
[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies]
huskarl-crypto-webcrypto = { workspace = true, optional = true }
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
gloo-timers = { version = "0.4", default-features = false, features = ["futures"] }
web-time = { version = "1", default-features = false }

[[example]]
name = "authorization_code"
required-features = ["authorization-flow-loopback"]

[[example]]
name = "basic_dpop"
required-features = ["authorization-flow-loopback"]

[[example]]
name = "client_credentials"
required-features = ["authorization-flow-loopback"]

[dev-dependencies]
huskarl = { path = ".", default-features = true }
huskarl-core = { workspace = true, features = ["strict-propagation"] }
huskarl-crypto-native = { path = "../huskarl-crypto-native" }
huskarl-resource-server = { path = "../huskarl-resource-server" }

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
huskarl = { path = ".", features = ["authorization-flow-loopback"] }
huskarl-reqwest = { path = "../huskarl-reqwest", features = ["rustls-tls"] }
rstest = { version = "0.26", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
reqwest = { version = "0.13", features = ["cookies", "form", "json", "query"] }
httpmock = "0.8.3"
