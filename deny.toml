# cargo-deny configuration — supply-chain gate for the huskarl workspace.
# Run locally with `cargo deny check`; CI runs the same in .github/workflows/deny.yml.

[graph]
# Check every target huskarl actually ships to, so platform-specific deps
# (Windows/macOS verifiers, wasm getrandom backends) are included in the scan.
all-features = true

[advisories]
# Pull the RustSec advisory DB and fail on any unwithdrawn vulnerability.
db-urls = ["https://github.com/rustsec/advisory-db"]
# Only flag unmaintained advisories for crates this workspace depends on
# directly.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 — "Marvin Attack" timing side-channel in the `rsa` crate.
  # Ref: https://github.com/RustCrypto/RSA/issues/19
  # See https://github.com/RustCrypto/RSA/pull/394
  #
  # The dependencies use an RC version of RSA which should have fixed this
  # particular sidechannel attack; but it's not yet in a non-RC version.
  { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release exists; huskarl does no RSA decryption" },
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Duplicate transitive versions are common and not a security issue on their
# own; surface them as a warning rather than failing the build.
multiple-versions = "warn"
# Ban version="*" deps from crates.io, but allow the workspace's own internal
# path deps (which are inherently versionless).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io — no git or alternate registries should slip in.
unknown-registry = "deny"
unknown-git = "deny"
